# Copia diaria: se hace, se restaura en el emulador y solo entonces se guarda.
#
# Secrets: FIREBASE_BACKUP_SA (cuenta de solo lectura) y BACKUP_KEY.
name: Copia de seguridad

on:
  schedule:
    - cron: '0 8 * * *' # 03:00 en Perú
  workflow_dispatch:
    inputs:
      type:
        description: Tipo de copia
        type: choice
        options: [auto, full, incremental]
        default: auto

# La misma cola que la restauración: nunca se ejecutan a la vez.
concurrency:
  group: backups
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  backup:
    name: Copiar, verificar y guardar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar las copias anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-backups.sh backups

      - name: Hacer la copia
        id: create
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BACKUP_SA }}
          BACKUP_TYPE: ${{ inputs.type || 'auto' }}
        run: node src/backup/cli.js create --dir backups --type "$BACKUP_TYPE"

      # Sin credenciales: restaura en un emulador desechable, sin tocar producción.
      - name: Verificar restaurando en el emulador
        env:
          BACKUP_ID: ${{ steps.create.outputs.id }}
        run: npx firebase emulators:exec --only firestore --project demo-stockseguro "node src/backup/cli.js verify --dir backups --id $BACKUP_ID"

      # Una copia que no pasa la verificación nunca llega aquí.
      - name: Guardar la copia
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ steps.create.outputs.id }}
          path: backups/${{ steps.create.outputs.id }}/
          if-no-files-found: error
          # Las completas viven más que las incrementales que dependen de ellas.
          retention-days: ${{ steps.create.outputs.type == 'full' && 90 || 30 }}
